<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#fbf4e6;font-family:'Segoe UI',Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#fbf4e6;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(91,26,46,0.10);">
      <tr>
        <td style="background:#5b1a2e;padding:26px 32px;text-align:center;border-bottom:4px solid #d9a441;">
          <div style="font-family:Georgia,'Times New Roman',serif;font-size:24px;letter-spacing:3px;color:#f4d98a;font-weight:700;">BRAHMAM PANDIT</div>
          <div style="font-size:12px;color:#f1dcc0;margin-top:4px;letter-spacing:1px;">Divine Traditions, Trusted Pandits.</div>
        </td>
      </tr>
      <tr>
        <td style="padding:32px;color:#3b2417;font-size:15px;line-height:1.65;">
          {{{content}}}
          {{{ctaBlock}}}
        </td>
      </tr>
      <tr>
        <td style="background:#fbf4e6;padding:22px 32px;text-align:center;color:#8a6d5a;font-size:12px;line-height:1.7;">
          <div style="font-weight:600;color:#5b1a2e;">Brahmam Pandit</div>
          <div>Questions? Write to <a href="mailto:{{supportEmail}}" style="color:#7b1e3a;">{{supportEmail}}</a> {{supportPhone}}</div>
          <div><a href="{{appUrl}}" style="color:#7b1e3a;">{{appUrl}}</a></div>
        </td>
      </tr>
    </table>
  </td></tr>
</table>
</body>
</html>
